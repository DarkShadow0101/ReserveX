services:
  postgres:
    image: postgres:16-alpine
    container_name: reservex-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-reservex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-reservex_secret}
      POSTGRES_DB: ${POSTGRES_DB:-reservex_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-reservex} -d ${POSTGRES_DB:-reservex_dev}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
